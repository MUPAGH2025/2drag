name: Projekt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy pint matplotlib open_atmos_jupyter_utils ipykernel numpy nbconvert PyMPDATA

      - name: Install system packages (LaTeX, Inkscape, Pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex inkscape pandoc

      - name: Execute notebook and export to PDF
        run: |
          cd PROJEKT
          jupyter nbconvert \
            --to pdf \
            --execute Projekt_MorzeMetanuNaTytanie.ipynb \
            --output projekt.pdf

      - name: Collect report artifacts (GIF + projekt.pdf)
        run: |
          mkdir -p artifacts
          # gify z katalogu PROJEKT (mogą nie istnieć – wtedy pomijamy błąd)
          cp PROJEKT/*.gif artifacts/ 2>/dev/null || true
          # tylko główny raport PDF
          cp PROJEKT/projekt.pdf artifacts/
          echo "Zebrane pliki w artifacts/:"
          ls -la artifacts

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projekt-raport
          path: artifacts
          if-no-files-found: error
